<script>
var idx = STATE.idx;
var view = STATE.view;
var hist = [];  // история переходов (для «назад» в random-режиме), максимум 10
var rpKicked = false;
var faded = false;

function fadeIn() {
  if (faded) return;
  faded = true;
  var f = document.getElementById("fade");
  if (f) f.className = "";
}

function fadeOutThen(go) {
  var f = document.getElementById("fade");
  if (!f) { go(); return; }
  f.className = "on";
  setTimeout(go, 190);
}

var stationFrame = document.getElementById("station-frame");
var frameLoadToken = 0;
var frameReady = false;
var randomMode = false;
var favMode = false;      // играют только избранные (зажатие ★)
var gridFilter = STATE.gridFilter || "all";  // "all" | "fav" — что показывает сетка

function loadStationFrame(i, autoplay) {
  var token = ++frameLoadToken;
  frameReady = false;
  var player = document.getElementById("player");
  if (player) player.classList.add("screen-loading");
  var st = S[i];
  // The provider script runs in its own document, so replacing a station never
  // reparses or reloads the iPod shell. srcdoc inherits this page's origin.
  var inner = '<!doctype html><html lang="ru"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f5f8ff;font:16px system-ui,sans-serif}' +
    'body{display:flex;align-items:center;justify-content:center;padding:4px;box-sizing:border-box}' +
    '.RP-SCRIPT{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;width:100%!important;max-width:100%!important;height:100%!important;max-height:100%!important;overflow:hidden!important;margin:0!important;padding:0!important;zoom:.84;box-sizing:border-box}' +
    '.RP-SCRIPT *{box-sizing:border-box!important;max-width:100%!important}' +
    '.RP-LINK{color:#f5f8ff!important;font-size:clamp(15px,4vw,20px)!important;font-weight:700;text-decoration:none}' +
    '#RP_playerjs{width:100%!important;max-width:100%!important;min-width:0!important;max-height:100%!important;overflow:hidden!important}' +
    '#RP_playerjs iframe,#RP_playerjs video,#RP_playerjs canvas,#RP_playerjs object,#RP_playerjs embed{max-width:100%!important;max-height:100%!important}' +
    '.RP-PLAYER-CONTROL{position:absolute!important;width:1px!important;height:1px!important;opacity:.01!important;overflow:hidden!important;pointer-events:none!important}' +
    '</style></head><body>' + embedCode(st) +
    '<script>window.__RADIO_AUTOPLAY=' + (autoplay ? 'true' : 'false') + ';<\/script>' +
    '<script>(function(){var n=0,iv=setInterval(function(){n++;var b=document.querySelector(".RP-PLAYER-CONTROL");if(!b)return;if(window.__RADIO_AUTOPLAY&&typeof RP_PLAYERJS!=="undefined"&&typeof RP_RADIO!=="undefined"){try{RP_PLAYERJS.api("play",RP_RADIO[RP_SCRIPT.curentId].stream);window.__RADIO_AUTOPLAY=false;}catch(e){}}if(n>45)clearInterval(iv);},350);})();<\/script>' +
    '</body></html>';
  stationFrame.onload = function () {
    if (token !== frameLoadToken) return;
    // Let the provider finish its deferred script and expose its controls.
    setTimeout(function () {
      if (token !== frameLoadToken) return;
      frameReady = !!(stationFrame.contentDocument && stationFrame.contentDocument.querySelector(".RP-PLAYER-CONTROL"));
      if (player) player.classList.remove("screen-loading");
      fadeIn();
      syncWheelGlyph();
    }, 450);
  };
  stationFrame.srcdoc = inner;
  // The shell remains visible even if the provider is slow or unavailable.
  setTimeout(function () {
    if (token === frameLoadToken && player) player.classList.remove("screen-loading");
  }, 5000);
}

function openStation(i, noHist) {
  var newIdx = (i + S.length) % S.length;
  if (!noHist && newIdx !== idx && idx >= 0 && S.length) {
    hist.push(idx);
    if (hist.length > 10) hist.shift();
  }
  idx = newIdx;
  view = "player";
  var box = document.getElementById("findbox");
  if (box) box.classList.remove("open");
  var grid = document.getElementById("grid");
  if (grid) grid.hidden = true;
  renderHead();
  history.replaceState(null, "", "#" + S[idx][0] + "/auto");
  loadStationFrame(idx, true);
  startTrackPoll();
}

function setView(v) {
  view = v;
  var tail = v === "grid" ? (gridFilter === "fav" ? "/favgrid" : "/grid") : "";
  history.replaceState(null, "", "#" + S[idx][0] + tail);
  var grid = document.getElementById("grid");
  if (v === "grid") {
    if (grid) { grid.hidden = false; renderGrid(); }
  } else {
    if (grid) grid.hidden = true;
    if (!stationFrame.srcdoc) loadStationFrame(idx, false);
  }
  renderHead();
} 

function fallbackSwitch(i) { openStation(i); }

function rpKick() {
  if (rpKicked || !DCL_PASSED) return;
  var box = document.getElementById("RP_playerjs");
  if (!box || box.childElementCount) return;
  rpKicked = true;
  var ev;
  try {
    ev = new Event("DOMContentLoaded", { bubbles: true });
  } catch (err) {
    ev = document.createEvent("Event");
    ev.initEvent("DOMContentLoaded", true, true);
  }
  document.dispatchEvent(ev);
}

function rpWatch() {
  var sc = document.querySelector('script[src*="/f/script6."]');
  if (sc) sc.addEventListener("load", function () { rpKick(); initWidget(); });
  window.addEventListener("load", function () {
    setTimeout(function () { rpKick(); initWidget(); }, 0);
  });
  setTimeout(function () {
    rpKick();
    initWidget();
    if (!widgetBuilt) { navFallback = true; applyNav(); }
  }, 3000);
}

function mkBtn(cls, glyph, title, fn) {
  var b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.title = title;
  b.setAttribute("aria-label", title);
  b.appendChild(document.createTextNode(glyph));
  b.addEventListener("click", fn);
  return b;
}

var widgetBuilt = false, wsFast = false, autoDone = false, navFallback = false;

function initWidget() {
  var btn = document.querySelector(".RP-PLAYER-CONTROL");
  if (!btn) return false;
  if (!widgetBuilt) {
    var wrap = btn.parentNode;
    if (wrap) {
      widgetBuilt = true;
      fadeIn();
      wrap.setAttribute("data-rpnav", "1");
      // Navigation is on the physical-style click wheel, not duplicated inside the screen.
      wrap.className = (wrap.className ? wrap.className + " " : "") + "rp-wrap";
    }
  }
  if (!wsFast) { wsFast = true; speedUpWs(); }
  if (!autoDone) {
    autoDone = true;
    if (STATE.auto) clearAuto();
    setTimeout(tryAutoPlay, 60);
  }
  applyNav();
  return widgetBuilt;
}

function wirePlayButton(btn) {
  if (!btn || !btn.getAttribute("onclick")) return;
  btn.removeAttribute("onclick");
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    try { RP_radioPlayPause(); } catch (err) { manualToggle(); }
  });
}

function manualToggle() {
  var b = document.querySelector(".RP-PLAYER-CONTROL");
  if (!b) return;
  var playing = b.getAttribute("data-state") === "playing";
  try {
    if (playing) {
      RP_PLAYERJS.api("stop");
      b.setAttribute("data-state", "stopped");
      b.title = "Включить воспроизведение";
    } else {
      RP_PLAYERJS.api("play", RP_RADIO[RP_SCRIPT.curentId].stream);
      b.setAttribute("data-state", "playing");
      b.title = "Остановить воспроизведение";
    }
  } catch (e) {}
}

function speedUpWs() {
  try {
    if (typeof RP_SCRIPT !== "undefined" && RP_SCRIPT) RP_SCRIPT.WS_UPDATE_TIME = 2500;
    if (typeof RP_WS_UpdateRequest !== "function") return;
    if (typeof CRON_UpdateRequest !== "undefined" && CRON_UpdateRequest) {
      clearInterval(CRON_UpdateRequest);
    }
    CRON_UpdateRequest = setInterval(RP_WS_UpdateRequest, 2500);
  } catch (e) {}
}

// ---- Название трека под станцией (основной источник: iframe WS; запасной: ICY) ----
var trackEl = document.getElementById("track");
var trackTimer = null;
var lastTrackText = null;

function setTrack(text) {
  text = (text || "").replace(/\s+/g, " ").trim();
  if (text === lastTrackText) return;
  lastTrackText = text;
  if (!text) { trackEl.className = ""; trackEl.innerHTML = ""; return; }
  trackEl.className = "";
  var span = document.createElement("span");
  span.className = "trk";
  span.textContent = text;
  trackEl.innerHTML = "";
  trackEl.appendChild(span);
  if (trackEl.scrollWidth > trackEl.clientWidth + 1) {
    span.textContent = text + "\u00a0\u00a0" + text;
    var dur = Math.max(6, text.length * 0.2);
    trackEl.style.setProperty("--trk-dur", dur + "s");
    trackEl.className = "scroll";
  }
}

function iframeTrack() {
  try {
    var w = stationFrame && stationFrame.contentWindow;
    if (!w || !w.RP_RADIO || !w.RP_SCRIPT) return "";
    var id = w.RP_SCRIPT.curentId;
    var t = w.RP_RADIO[id] && w.RP_RADIO[id].track;
    if (!t) return "";
    t = String(t).replace(/<br\s*\/?>/gi, " - ").trim();
    if (t === "Прямой эфир") return "";
    return t;
  } catch (e) { return ""; }
}

function icyTrack(sid, cb) {
  try {
    fetch("/api/track?id=" + encodeURIComponent(sid), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { cb(j && j.raw ? j.raw : ""); })
      .catch(function () { cb(""); });
  } catch (e) { cb(""); }
}

function pollTrack() {
  if (idx < 0 || !S.length) { setTrack(""); return; }
  var sid = S[idx][0];
  var t = iframeTrack();
  if (t) { setTrack(t); return; }
  icyTrack(sid, function (raw) {
    if (idx >= 0 && S.length && S[idx][0] === sid) setTrack(raw);
  });
}

function startTrackPoll() {
  if (trackTimer) clearInterval(trackTimer);
  setTrack("");
  pollTrack();
  trackTimer = setInterval(pollTrack, 3000);
}

function clearAuto() {
  var url = "#" + S[idx][0];
  try { history.replaceState(null, "", url); return; } catch (e) {}
  try { location.hash = url; } catch (e) {}
}

function mediaEl() {
  try {
    var box = document.getElementById("RP_playerjs");
    return box ? (box.querySelector("audio") || box.querySelector("video")) : null;
  } catch (e) { return null; }
}

function apiPlaying() {
  try { return !!RP_PLAYERJS.api("playing"); } catch (e) { return false; }
}

function playerReady() {
  try {
    if (typeof RP_PLAYERJS === "undefined" || !RP_PLAYERJS) return false;
    return typeof RP_PLAYERJS.api("playlist_length") === "number";
  } catch (e) { return false; }
}

function forcePlay() {
  try {
    if (typeof RP_PLAYERJS === "undefined" || typeof RP_RADIO === "undefined") return;
    RP_PLAYERJS.api("play", RP_RADIO[RP_SCRIPT.curentId].stream);
    var b = document.querySelector(".RP-PLAYER-CONTROL");
    if (b) {
      b.setAttribute("data-state", "playing");
      b.title = "Остановить воспроизведение";
    }
  } catch (e) {}
}

function tryAutoPlay() {
  var n = 0, started = 0;
  var iv = setInterval(function () {
    n++;
    var m = mediaEl();
    if (m && !m.paused && !m.ended) { clearInterval(iv); return; }
    if (!started) {
      if (playerReady()) { started = n; forcePlay(); }
      else if (n >= 15) { clearInterval(iv); autoBlocked(true); }
      return;
    }
    if ((n - started) % 3 === 0) forcePlay();
    if (n - started >= 8) {
      clearInterval(iv);
      var mm = mediaEl();
      if (mm && !mm.paused) return;
      autoBlocked(!mm);
    }
  }, 400);
}

function autoBlocked(missing) {
  var b = document.querySelector(".RP-PLAYER-CONTROL");
  if (b) {
    b.setAttribute("data-state", "stopped");
    b.title = "Включить воспроизведение";
  }
  toast(missing ? "Плеер не загрузился — обновите страницу"
                : "Браузер запретил автозапуск — нажмите ▶");
}

var toastEl = null, toastT = 0;
function toast(msg) {
  try {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.id = "toast";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.className = "on";
    clearTimeout(toastT);
    toastT = setTimeout(function () { if (toastEl) toastEl.className = ""; }, 4500);
  } catch (e) {}
}

function applyNav() {
  var show = (view === "grid") || !!navFallback;
  var nav = document.querySelector(".nav");
  if (nav) nav.className = show ? "nav" : "nav off";
}

function renderHead() {
  var st = S[idx];
  var link = document.getElementById("stlink");
  link.textContent = st[1];
  link.href = BASE + st[2];
  if (favMode) {
    var list = favIndices();
    var pos = list.indexOf(idx);
    document.getElementById("stpos").textContent = (pos < 0 ? "–" : (pos + 1)) + " / " + list.length + " ★";
  } else {
    document.getElementById("stpos").textContent = (idx + 1) + " / " + S.length;
  }
  document.getElementById("codetext").value = embedCode(st);
  updateCornerBtns();
}

function renderGrid() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  var list = gridFilter === "fav" ? favIndices() : null;
  if (list && !list.length) {
    var note = document.createElement("div");
    note.className = "grid-note";
    note.textContent = "Нет избранных — отметьте станции ★";
    grid.appendChild(note);
    return;
  }
  var frag = document.createDocumentFragment();
  var count = list ? list.length : S.length;
  for (var k = 0; k < count; k++) {
    (function (n) {
      var id = S[n][0];
      var hid = isHid(id);
      var row = document.createElement("div");
      row.className = "grow" + (hid ? " hidden-row" : "");
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = "<b>" + esc(S[n][1]) + "</b><i>id " + esc(id) + "</i>";
      b.onclick = function () { openStation(n); };
      var acts = document.createElement("span");
      acts.className = "acts";
      var favB = document.createElement("button");
      favB.type = "button"; favB.className = "act" + (isFav(id) ? " on" : "");
      favB.textContent = "★"; favB.title = "В избранное";
      favB.onclick = function (e) { e.stopPropagation(); toggleFav(n); };
      var hidB = document.createElement("button");
      hidB.type = "button"; hidB.className = "act hide" + (hid ? " on" : "");
      hidB.textContent = "✕"; hidB.title = hid ? "Вернуть в ротацию" : "Скрыть из ротации";
      hidB.onclick = function (e) { e.stopPropagation(); toggleHide(n); };
      acts.appendChild(favB); acts.appendChild(hidB);
      row.appendChild(b); row.appendChild(acts);
      frag.appendChild(row);
    })(list ? list[k] : k);
  }
  grid.appendChild(frag);
}

function search(term) {
  var drop = document.getElementById("drop");
  term = term.trim().toLowerCase();
  if (!term) { drop.className = "drop"; drop.innerHTML = ""; return []; }
  var res = [];
  for (var i = 0; i < S.length && res.length < 60; i++) {
    if (S[i][1].toLowerCase().indexOf(term) >= 0 || S[i][0].indexOf(term) === 0) {
      res.push(i);
    }
  }
  if (!res.length) {
    drop.className = "drop on";
    drop.innerHTML = '<button type="button" disabled>Ничего не найдено</button>';
    return [];
  }
  var out = "";
  for (var j = 0; j < res.length; j++) {
    out += '<button type="button" data-i="' + res[j] + '">' +
      esc(S[res[j]][1]) + "<i>" + esc(S[res[j]][0]) + "</i></button>";
  }
  drop.className = "drop on";
  drop.innerHTML = out;
  return res;
}

function stepStation(direction) {
  var pool = favMode ? favIndices() : null;
  if (randomMode) {
    if (direction < 0) {
      if (hist.length) return openStation(hist.pop(), true);
      return;
    }
    var src = pool && pool.length ? pool : null;
    if (src) {
      if (src.length < 2) return openStation(src[0] === idx ? idx : src[0]);
      var pick = idx;
      while (pick === idx) pick = src[Math.floor(Math.random() * src.length)];
      return openStation(pick);
    }
    if (S.length < 2) return openStation(idx);
    var next = idx;
    while (next === idx) next = Math.floor(Math.random() * S.length);
    openStation(next);
  } else if (pool && pool.length) {
    var pos = pool.indexOf(idx);
    if (pos < 0) return openStation(pool[0]);
    openStation(pool[(pos + direction + pool.length) % pool.length]);
  } else {
    openStation((idx + direction + S.length) % S.length);
  }
}
document.getElementById("wheel-prev").onclick = function () { stepStation(-1); };
document.getElementById("wheel-next").onclick = function () { stepStation(1); };
var randomButton = document.getElementById("random-btn");
randomButton.addEventListener("click", function () {
  randomMode = !randomMode;
  randomButton.classList.toggle("active", randomMode);
  randomButton.setAttribute("aria-pressed", randomMode ? "true" : "false");
  randomButton.title = randomMode ? "Случайное переключение включено" : "Случайное переключение выключено";
  toast(randomMode ? "Случайное переключение включено" : "Обычный порядок станций");
});
var favListButton = document.getElementById("favlist-btn");
var favHoldT = 0, favLongFired = false;

function favModeToggle() {
  var list = favIndices();
  if (!list.length) { toast("Нет избранных — отметьте станции ★"); return; }
  favMode = !favMode;
  favListButton.classList.toggle("active", favMode);
  favListButton.setAttribute("aria-pressed", favMode ? "true" : "false");
  if (favMode && list.indexOf(idx) < 0) {
    toast("Играют только избранные: " + list.length);
    openStation(list[0]);
    return;
  }
  toast(favMode ? "Играют только избранные: " + list.length : "Вся ротация станций");
  renderHead();
}

favListButton.addEventListener("pointerdown", function (e) {
  if (e.target && e.target.id === "fav-hint") return;
  favLongFired = false;
  clearTimeout(favHoldT);
  favHoldT = setTimeout(function () { favLongFired = true; favModeToggle(); }, 550);
});
["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
  favListButton.addEventListener(ev, function () { clearTimeout(favHoldT); });
});
favListButton.addEventListener("contextmenu", function (e) { e.preventDefault(); });
favListButton.addEventListener("click", function (e) {
  if (e.target && e.target.id === "fav-hint") return;
  if (favLongFired) { favLongFired = false; return; }
  if (view === "grid" && gridFilter === "fav") { setView("player"); return; }
  gridFilter = "fav";
  setView("grid");
});
document.getElementById("fav-hint").addEventListener("click", function (e) {
  e.stopPropagation();
  e.preventDefault();
  toast("Избранное: тап — список ★, зажать (~0.5с) — играть только избранные");
});
var skinButton = document.getElementById("skin-btn");
var skinNames = ["Серебристый", "Hi-Fi графит", "Белый минимализм", "Неоновый", "Чёрный с хромом"];
var skinClasses = ["", "skin-hifi", "skin-white", "skin-neon", "skin-chrome"];
var skinIndex = 0;
skinButton.addEventListener("click", function () {
  skinIndex = (skinIndex + 1) % skinClasses.length;
  skinClasses.forEach(function (cls) { if (cls) document.body.classList.remove(cls); });
  if (skinClasses[skinIndex]) document.body.classList.add(skinClasses[skinIndex]);
  skinButton.title = "Сменить оформление (сейчас: " + skinNames[skinIndex] + ")";
  toast("Оформление: " + skinNames[skinIndex]);
});
document.getElementById("copy-code").addEventListener("click", function () {
  var code = embedCode(S[idx]);
  function copied() { toast("Код станции скопирован"); }
  function fallbackCopy() {
    var t = document.getElementById("codetext");
    t.value = code; t.style.position = "fixed"; t.style.left = "0"; t.style.opacity = "0.01";
    t.select();
    try { if (document.execCommand("copy")) copied(); else toast("Не удалось скопировать код"); }
    catch (e) { toast("Не удалось скопировать код"); }
    t.style.position = "absolute"; t.style.left = "-9999px"; t.style.opacity = "0";
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(copied).catch(fallbackCopy);
  else fallbackCopy();
});

// Mobile browsers reject automatic fullscreen on load. Request it on the first real tap/click.
var fullscreenAttempted = false;
function requestFirstFullscreen() {
  if (fullscreenAttempted || document.fullscreenElement || document.webkitFullscreenElement) return;
  fullscreenAttempted = true;
  var target = document.documentElement;
  var request = target.requestFullscreen || target.webkitRequestFullscreen;
  if (request) {
    try { var result = request.call(target); if (result && result.catch) result.catch(function () {}); } catch (e) {}
  }
}
document.addEventListener("pointerdown", requestFirstFullscreen, {once:true, passive:true});
// The wheel's center delegates to the radio site's own play/pause control.
// This preserves the provider's original playback handler instead of replacing it.
var wheelHub = document.getElementById("wheel-hub");
var wheelGlyph = document.getElementById("wheel-play-glyph");
function syncWheelGlyph() {
  var playing = false;
  try {
    var d = stationFrame && stationFrame.contentDocument;
    var m = d && d.querySelector("audio,video");
    playing = !!(m && !m.paused && !m.ended);
  } catch (e) {}
  wheelGlyph.innerHTML = playing
    ? '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 9 H20 V39 H11 Z M28 9 H37 V39 H28 Z"/></svg>'
    : '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 7 L41 24 L15 41 Z"/></svg>';
  document.body.classList.toggle("playing", playing);
}
wheelHub.addEventListener("click", function () {
  var innerDoc = null;
  try { innerDoc = stationFrame.contentDocument; } catch (e) {}
  var original = innerDoc && innerDoc.querySelector(".RP-PLAYER-CONTROL");
  if (original) {
    original.click();
    setTimeout(syncWheelGlyph, 250);
    setTimeout(syncWheelGlyph, 900);
  } else {
    toast("Радиоплеер ещё загружается. Попробуйте через секунду.");
  }
});
setInterval(syncWheelGlyph, 1200);
document.getElementById("wheel-all").onclick = function () {
  if (view === "grid" && gridFilter === "all") { setView("player"); return; }
  gridFilter = "all";
  setView("grid");
};
document.getElementById("wheel-station").onclick = function () {
  var box = document.getElementById("findbox");
  box.classList.toggle("open");
  if (box.classList.contains("open")) { q.focus(); }
  else { q.value = ""; search(""); }
};

var q = document.getElementById("q");
q.addEventListener("input", function () { search(q.value); });
q.addEventListener("focus", function () { if (q.value) search(q.value); });
q.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    var first = search(q.value);
    if (first.length) openStation(first[0]);
  } else if (e.key === "Escape") {
    q.value = "";
    search("");
    q.blur();
  }
});
document.getElementById("drop").addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("button[data-i]") : null;
  if (b) openStation(parseInt(b.getAttribute("data-i"), 10));
});
document.addEventListener("click", function (e) {
  if (!(e.target.closest && e.target.closest(".find"))) {
    document.getElementById("drop").className = "drop";
  }
});
document.addEventListener("keydown", function (e) {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowLeft") stepStation(-1);
  else if (e.key === "ArrowRight") stepStation(1);
  else if (e.key === "/") { e.preventDefault(); q.focus(); }
});

// ---- данные с сервера: избранное / скрытые / список станций ----
var FAV = {};   // id -> true
var HID = {};   // id -> true

function isFav(id) { return !!FAV[id]; }
function isHid(id) { return !!HID[id]; }

// избранные, но не скрытые — пул для режима «только избранные»
function favIndices() {
  var out = [];
  for (var i = 0; i < S.length; i++) {
    var id = S[i][0];
    if (FAV[id] && !HID[id]) out.push(i);
  }
  return out;
}

function postJSON(url, data) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).then(function (r) { return r.json(); }).catch(function () {});
}

function toggleFav(i) {
  var id = S[i][0];
  if (FAV[id]) delete FAV[id]; else FAV[id] = true;
  postJSON("/api/favorites", { id: id });
  if (view === "grid") renderGrid();
  syncFavMode();
}

function toggleHide(i) {
  var id = S[i][0];
  if (HID[id]) delete HID[id]; else HID[id] = true;
  postJSON("/api/hidden", { id: id });
  if (view === "grid") renderGrid();
  toast(HID[id] ? "Скрыто из ротации" : "Возвращено в ротацию");
  syncFavMode();
}

// если в режиме «только избранные» пул опустел — выключаем режим
function syncFavMode() {
  if (!favMode) return;
  if (!favIndices().length) {
    favMode = false;
    if (favListButton) {
      favListButton.classList.remove("active");
      favListButton.setAttribute("aria-pressed", "false");
    }
    toast("Избранные закончились — вся ротация станций");
  }
  renderHead();
}

function updateCornerBtns() {
  if (idx < 0 || !S.length) return;
  var id = S[idx][0];
  var hid = isHid(id), fav = isFav(id);
  var hb = document.getElementById("hide-btn");
  var fb = document.getElementById("fav-btn");
  if (hb) { hb.classList.toggle("active", hid); hb.title = hid ? "Вернуть в ротацию" : "Скрыть из ротации"; }
  if (fb) { fb.classList.toggle("active", fav); fb.title = fav ? "Убрать из избранного" : "В избранное"; }
}
document.getElementById("hide-btn").onclick = function () { toggleHide(idx); updateCornerBtns(); };
document.getElementById("fav-btn").onclick = function () { toggleFav(idx); updateCornerBtns(); };

function bootWeb() {
  Promise.all([
    fetch("/api/stations").then(function (r) { return r.json(); }),
    fetch("/api/favorites").then(function (r) { return r.json(); }),
    fetch("/api/hidden").then(function (r) { return r.json(); })
  ]).then(function (res) {
    S = res[0] || [];
    FAV = {}; (res[1] || []).forEach(function (id) { FAV[id] = true; });
    HID = {}; (res[2] || []).forEach(function (id) { HID[id] = true; });
    var parts = (location.hash || "").replace(/^#/, "").split("/");
    for (var i = 0; i < S.length; i++) if (S[i][0] === parts[0]) { idx = i; break; }
    var foot = document.querySelector("footer");
    if (foot) foot.textContent = S.length + " STATIONS · radiopotok.ru";
    renderHead();
    applyNav();
    if (view === "grid") {
      document.getElementById("grid").hidden = false;
      renderGrid();
      fadeIn();
    } else {
      document.getElementById("grid").hidden = true;
      if (S.length) { loadStationFrame(idx, !!STATE.auto); startTrackPoll(); }
      else fadeIn();
    }
  }).catch(function (e) {
    console.error("bootWeb", e);
    fadeIn();
    toast("Не удалось загрузить список станций");
  });
}
bootWeb();
</script>
